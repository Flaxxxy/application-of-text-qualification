# Central settings for the whole project.
# Code never hard-codes paths or magic numbers; it reads them from here via src/config.py.
# All paths are relative to the repo root.

seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models_train: models/train      # git-ignored, big training outputs
  models_deploy: models/deploy    # committed, small ONNX models used by the website
  results: results
  figures: results/figures
  demo_data: demo_data

# Safety limit for scripts/download_data.py: anything bigger needs --allow-large.
download:
  max_size_gb: 2.0

# ---------------------------------------------------------------- text ----
text:
  labels: [negative, neutral, positive]
  # One rule for every source that has stars (see CLAUDE.md 5.1).
  rating_to_label: {1: negative, 2: negative, 3: neutral, 4: positive, 5: positive}
  min_words: 3
  per_class_target: 15000         # after balancing, roughly this many reviews per class
  max_class_ratio: 3.0            # inside one source, no class > 3x its smallest class
  split: {train: 0.70, val: 0.15, test: 0.15}

  sources:
    amazon_lecturer:
      kind: kaggle
      slug: mehmetisik/amazon-review
      category: electronics
      role: train                 # used for train/val/test
    customer_feedback:
      kind: kaggle
      slug: vishweshsalodkar/customer-feedback-dataset
      category: other
      role: external_test         # never trained on, only an outside check
    flipkart:
      kind: kaggle
      slug: niraliivaghani/flipkart-product-customer-reviews-dataset
      category: other
      role: train
    amazon2023_electronics:
      kind: hf_sample
      repo: McAuley-Lab/Amazon-Reviews-2023
      file: raw/review_categories/Electronics.jsonl   # 22.6 GB, we only read small pieces
      category: electronics
      role: train
    amazon2023_grocery:
      kind: hf_sample
      repo: McAuley-Lab/Amazon-Reviews-2023
      file: raw/review_categories/Grocery_and_Gourmet_Food.jsonl   # 6.0 GB
      category: grocery
      role: train

  # How we sample the huge Amazon 2023 files without downloading them.
  # The files are sorted by user, so the first N lines would come from only a few
  # people. Instead we read n_chunks small pieces from random places in the file.
  hf_sample:
    n_chunks: 30
    lines_per_chunk: 10000        # 30 x 10k = 300k lines per category (~200 MB)

  models:
    minilm: sentence-transformers/all-MiniLM-L6-v2
    minilm_max_length: 256        # tokens; the ONNX export in Phase 5 must use the same value
    distilbert: distilbert-base-uncased
    tfidf: {ngram_range: [1, 2], min_df: 2, max_features: 50000}
    roberta: cardiffnlp/twitter-roberta-base-sentiment-latest   # also fine-tuned on Colab

  # Fine-tuning on Colab (notebooks/colab_03_finetune_text.ipynb). Same settings for both
  # models so the comparison is fair.
  finetune:
    models:
      distilbert_finetuned: distilbert-base-uncased
      roberta_finetuned: cardiffnlp/twitter-roberta-base-sentiment-latest
    epochs: 2
    max_length: 256
    batch_size: 32
    learning_rate: 2.0e-5

  # Ready-made models from the internet, tested as they are (no training) for the
  # "our model vs others" comparison. `labels` says how their outputs map to ours.
  benchmarks:
    cardiffnlp_roberta:
      model: cardiffnlp/twitter-roberta-base-sentiment-latest
      labels: {negative: negative, neutral: neutral, positive: positive}
    nlptown_stars:
      model: nlptown/bert-base-multilingual-uncased-sentiment
      labels: {1 star: negative, 2 stars: negative, 3 stars: neutral, 4 stars: positive, 5 stars: positive}
    hf_default_pipeline:
      model: distilbert/distilbert-base-uncased-finetuned-sst-2-english
      labels: {NEGATIVE: negative, POSITIVE: positive}   # binary: it can never say "neutral"

# -------------------------------------------------------------- images ----
images:
  size: 224
  split: {train: 0.70, val: 0.10, test: 0.20}
  # Copy detection (src/data_images.py): two images are copies if their SSCD similarity is
  # at least min_similarity. 0.65 was chosen by looking at fruit pairs: at 0.60-0.75 almost all
  # pairs are rotated/flipped/noised copies of one photo.
  dedup:
    min_similarity: 0.65
    overrides:
      # The Kaggle packages are 3D renders of one box on one conveyor belt: SSCD sees every
      # render as a near-copy (>0.9), even damaged vs intact. Checked: no pair reaches 0.99,
      # and at 0.98 half the matches have different labels. So only exact copies count here.
      packages_kaggle: 0.99

  sources:
    packages_kaggle:
      kind: kaggle
      slug: christianvorhemus/industrial-quality-control-of-packages
      domain: packages
    packages_roboflow:
      kind: roboflow
      workspace: aadhavs-first-workspace
      project: damaged-vs-good-packages
      version: 1
      format: folder              # classification export: one folder per class
      domain: packages
    packages_boxcondition:        # added 2026-10-13 (Denis): brown cardboard in BOTH classes
      kind: roboflow
      workspace: sih-yna9n
      project: boxcondition-onzuw
      version: 1
      format: folder
      domain: packages
    produce_kaggle:
      kind: kaggle
      slug: sriramr/fruits-fresh-and-rotten-for-classification
      domain: produce

  # Training settings for both image models (src/image_models.py), same for both domains.
  train:
    batch_size: 32
    epochs_cnn: 40          # small CNN from scratch (early stopping usually ends it sooner)
    lr_cnn: 1.0e-3
    epochs_head: 15         # MobileNetV2 stage 1: base frozen, only the head learns
    lr_head: 1.0e-3
    epochs_finetune: 15     # MobileNetV2 stage 2: top layers of the base unfrozen
    lr_finetune: 1.0e-5
    finetune_layers: 30
    patience: 5             # early stopping: epochs without val-loss improvement
  target_recall_bad: 0.90   # threshold tuning: catch at least 90% of damaged/rotten on validation
  clip_model: openai/clip-vit-base-patch32   # zero-shot baseline

  # Unlabelled customer photos for the website demo only (never for training).
  demo_photos:
    max_images: 30

# Which image model runs for each product category (CLAUDE.md section 3).
routing:
  electronics: packages
  grocery: produce
  default: packages

# ------------------------------------------------------------- fusion -----
# Tuned on the simulated-orders validation set (notebooks/07_fusion.ipynb, 2026-10-14):
# the most balanced weights within 0.01 F1 of the best (best single setting was text 1.0 / image 0,
# val F1 0.915; this one 0.905). To be reviewed once more at the end of the project.
fusion:
  weights: {text: 0.30, image: 0.40, tag: 0.30}
  thresholds: {review: 0.40, urgent: 0.70}
  n_simulated_orders: 300         # per set: one set to tune the weights, one to report results
  # Share of each (true review label + true photo label) combination in the simulated orders,
  # so every 2x2 case appears often enough. Shares must add up to 1.
  pairing_mix:
    negative+bad: 0.20
    negative+good: 0.15
    neutral+bad: 0.10
    neutral+good: 0.15
    positive+bad: 0.10
    positive+good: 0.30

# ---------------------------------------------------------------- app -----
app:
  max_upload_mb: 10
  max_batch_rows: 100
  history_limit: 50
  db_path: app/predictions.db
