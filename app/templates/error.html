{% extends "base.html" %}
{% block title %}Problem{% endblock %}
{% block pretitle %}Something went wrong{% endblock %}
{% block heading %}Sorry{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <div class="empty">
      <div class="empty-icon"><i class="ti ti-alert-circle"></i></div>

      <div class="empty-action"><a href="{{ url_for('home') }}" class="btn btn-primary"><i class="ti ti-home me-1"></i>Back to the start</a></div>
    </div>
  </div>
</div>
{% endblock %}
